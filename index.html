<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de Campanhas</title>
  <meta name="description" content="Organize suas ofertas, campanhas, vendas, custos e lucro — sem trackeamento, 100% local.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M8 21l5-6 4 3 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    // Aplica o tema antes de renderizar para evitar "piscar".
    try {
      var t = JSON.parse(localStorage.getItem('gestor-campanhas:v1') || '{}').settings;
      if (t && (t.theme === 'light' || t.theme === 'dark')) document.documentElement.setAttribute('data-theme', t.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"></span>
        <div>
          <div class="brand-name">Gestor de Campanhas</div>
          <div class="brand-sub" id="brandSub">Uso pessoal · sem tracking</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-block" id="themeToggle" type="button"></button>
        <div class="muted small" id="saveStatus">Dados salvos neste navegador</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Abrir menu"></button>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <div class="topbar-actions">
          <div class="period" id="periodPicker"></div>
          <button class="btn btn-primary" id="quickAdd" type="button" title="Atalho: N"></button>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/metrics.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/dashboard.js"></script>
  <script src="assets/js/pages/campaigns.js"></script>
  <script src="assets/js/pages/offers.js"></script>
  <script src="assets/js/pages/spy.js"></script>
  <script src="assets/js/pages/swipe.js"></script>
  <script src="assets/js/pages/sales.js"></script>
  <script src="assets/js/pages/costs.js"></script>
  <script src="assets/js/pages/settings.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
